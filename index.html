<!DOCTYPE html>
<html>
<head>
<title>Dodge!</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
    color: white;
  }
  canvas {
    background: #1e1e2f;
    border: 3px solid #7dd3fc;
    border-radius: 12px;
  }
  #score {
    font-size: 1.5em;
    margin-bottom: 10px;
    color: #7dd3fc;
  }
  #gameOver {
    display: none;
    margin-top: 15px;
    font-size: 1.3em;
    color: #ff6b6b;
  }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="500"></canvas>
  <div id="gameOver">Game Over! Press R to restart</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOver");

let player = { x: 180, y: 450, w: 40, h: 40, speed: 6 };
let blocks = [];
let score = 0;
let gameOver = false;
let keys = {};
let frame = 0;
let animId;

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === "r" || e.key === "R") {
    if (gameOver) restart();
  }
});
document.addEventListener("keyup", e => keys[e.key] = false);

function spawnBlock() {
  const size = 20 + Math.random() * 30;
  blocks.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    w: size,
    h: size,
    speed: 2 + Math.random() * 3 + score * 0.05
  });
}

function restart() {
  cancelAnimationFrame(animId);
  player.x = 180;
  blocks = [];
  score = 0;
  frame = 0;
  gameOver = false;
  gameOverEl.style.display = "none";
  loop();
}

function update() {
  if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
  if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;

  blocks.forEach(b => b.y += b.speed);
  blocks = blocks.filter(b => b.y < canvas.height + 50);

  blocks.forEach(b => {
    if (
      player.x < b.x + b.w &&
      player.x + player.w > b.x &&
      player.y < b.y + b.h &&
      player.y + player.h > b.y
    ) {
      gameOver = true;
    }
  });

  score++;
  scoreEl.textContent = "Score: " + score;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#7dd3fc";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "#ff6b6b";
  blocks.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
}

function loop() {
  if (gameOver) {
    gameOverEl.style.display = "block";
    return;
  }
  frame++;
  if (frame % 40 === 0) spawnBlock();
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
