<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
      color: #7dd3fc;
    }
    p {
      font-size: 1.2em;
      color: #ccc;
    }
    .card {
      background: #26263a;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 500px;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      background: #7dd3fc;
      color: #1e1e2f;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, this is my website!</h1>
    <p>Made by omaristhecoolestperson.</p>
    <span class="badge">🎮 Game Dev — Godot</span>
  </div>
</body>
</html>
