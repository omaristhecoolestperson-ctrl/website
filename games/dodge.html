<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge — Omar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17131f;
    --text: #f3efe8;
    --text-muted: #a89fb8;
    --accent: #ffb347;
    --accent-2: #6ee7d8;
    --line: rgba(243, 239, 232, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  .top {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  a.back {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--line);
  }
  a.back:hover { color: var(--text); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem;
    margin: 0;
  }
  #score {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 12px;
  }
  canvas {
    background: #1f1a2b;
    border: 1px solid var(--line);
    border-radius: 12px;
    touch-action: none;
  }
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  #restartBtn {
    display: none;
    padding: 11px 22px;
    background: var(--accent);
    color: #1a1420;
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #status {
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  #status.over { color: #ff8b8b; }
  .hint {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="top">
  <h1>Dodge</h1>
  <a class="back" href="../index.html">&larr; Back to portfolio</a>
</div>

<div id="score">Score: 0</div>
<canvas id="game" width="380" height="480"></canvas>

<div class="controls">
  <div id="status">Use &larr; and &rarr; to move</div>
  <button id="restartBtn">Restart</button>
</div>
<div class="hint">On mobile: touch the left or right half of the game to move.</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const restartBtn = document.getElementById("restartBtn");

let player = { x: 170, y: 430, w: 40, h: 40, speed: 6 };
let blocks = [];
let score = 0;
let gameOver = false;
let keys = {};
let frame = 0;
let animId;

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if ((e.key === "r" || e.key === "R") && gameOver) restart();
});
document.addEventListener("keyup", e => keys[e.key] = false);

// Touch controls: tap left/right half to move that direction while held
let touchDir = 0;
canvas.addEventListener("touchstart", handleTouch, { passive: true });
canvas.addEventListener("touchmove", handleTouch, { passive: true });
canvas.addEventListener("touchend", () => touchDir = 0);
function handleTouch(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  touchDir = x < rect.width / 2 ? -1 : 1;
}

restartBtn.addEventListener("click", restart);

function spawnBlock() {
  const size = 20 + Math.random() * 30;
  blocks.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    w: size,
    h: size,
    speed: 2 + Math.random() * 3 + score * 0.05
  });
}

function restart() {
  cancelAnimationFrame(animId);
  player.x = 170;
  blocks = [];
  score = 0;
  frame = 0;
  gameOver = false;
  restartBtn.style.display = "none";
  statusEl.textContent = "Use \u2190 and \u2192 to move";
  statusEl.classList.remove("over");
  loop();
}

function update() {
  if (keys["ArrowLeft"] || touchDir === -1) player.x -= player.speed;
  if (keys["ArrowRight"] || touchDir === 1) player.x += player.speed;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  blocks.forEach(b => b.y += b.speed);
  blocks = blocks.filter(b => b.y < canvas.height + 50);

  blocks.forEach(b => {
    if (
      player.x < b.x + b.w &&
      player.x + player.w > b.x &&
      player.y < b.y + b.h &&
      player.y + player.h > b.y
    ) {
      gameOver = true;
    }
  });

  score++;
  scoreEl.textContent = "Score: " + score;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#6ee7d8";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "#ffb347";
  blocks.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
}

function loop() {
  if (gameOver) {
    statusEl.textContent = "Game over — press R or tap Restart";
    statusEl.classList.add("over");
    restartBtn.style.display = "inline-block";
    return;
  }
  frame++;
  if (frame % 40 === 0) spawnBlock();
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
