<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Wrap — Omar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17131f;
    --text: #f3efe8;
    --text-muted: #a89fb8;
    --accent: #ffb347;
    --accent-2: #6ee7d8;
    --line: rgba(243, 239, 232, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 50px;
  }
  .top {
    width: 480px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  a.back {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--line);
  }
  a.back:hover { color: var(--text); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem;
    margin: 0;
  }
  p.sub {
    width: 480px;
    max-width: 100%;
    color: var(--text-muted);
    font-size: 0.92rem;
    margin: 0 0 20px;
  }

  .hud {
    width: 480px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  #count { color: var(--accent); }
  button.small {
    padding: 9px 16px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button.small:hover { border-color: var(--accent); }

  #sheet {
    width: 480px;
    max-width: 100%;
    background: #1f1a2b;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
  }

  .bubble {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.08) 45%, transparent 60%),
      radial-gradient(circle at center, #3a3350, #241f33 70%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.15);
    cursor: pointer;
    transition: transform 0.06s ease;
  }

  .bubble:active { transform: scale(0.9); }

  .bubble.popped {
    background: radial-gradient(circle at center, #1a1625, #14111e 70%);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    cursor: default;
    animation: pop 0.18s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(0.78); }
    100% { transform: scale(1); }
  }

  .hint {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="top">
  <h1>Bubble Wrap</h1>
  <a class="back" href="../index.html">&larr; Back to portfolio</a>
</div>
<p class="sub">Exactly what it sounds like. Pop them all.</p>

<div class="hud">
  <div id="count">Popped: 0 / 64</div>
  <button class="small" id="resetBtn">New sheet</button>
</div>

<div id="sheet"></div>

<div class="hint">Sound plays on click — turn your volume up if you want the full effect.</div>

<script>
const sheet = document.getElementById('sheet');
const countEl = document.getElementById('count');
const resetBtn = document.getElementById('resetBtn');
const TOTAL = 64;
let popped = 0;

let audioCtx = null;
function pop() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const freq = 220 + Math.random() * 180;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.4, t + 0.09);
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.13);
  } catch (e) { /* audio not available, silently continue */ }
}

function buildSheet() {
  sheet.innerHTML = '';
  popped = 0;
  countEl.textContent = 'Popped: 0 / ' + TOTAL;
  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.addEventListener('click', () => {
      if (b.classList.contains('popped')) return;
      b.classList.add('popped');
      popped++;
      countEl.textContent = 'Popped: ' + popped + ' / ' + TOTAL;
      pop();
    });
    sheet.appendChild(b);
  }
}

resetBtn.addEventListener('click', buildSheet);
buildSheet();
</script>

</body>
</html>
